<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1e1b4b" />
  <title>Mighty Final Fight (NES) — Kubo Touch</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background:
        radial-gradient(circle at 50% 14%, rgba(250, 204, 21, 0.24) 0%, rgba(250, 204, 21, 0) 42%),
        radial-gradient(circle at 20% 82%, rgba(239, 68, 68, 0.24) 0%, rgba(239, 68, 68, 0) 46%),
        radial-gradient(circle at 82% 78%, rgba(59, 130, 246, 0.2) 0%, rgba(59, 130, 246, 0) 45%),
        linear-gradient(180deg, #4c1d95 0%, #1e1b4b 52%, #090b1a 100%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .header {
      text-align: center;
    }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fde047;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(250, 204, 21, 0.55);
      padding: 3px 11px;
      border-radius: 999px;
      margin-bottom: 4px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 900;
      color: #fde047;
      text-shadow: 0 3px 0 #991b1b, 0 8px 20px rgba(0, 0, 0, 0.65);
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      max-height: 68dvh;
      background: #090b1a;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid rgba(250, 204, 21, 0.38);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), 0 0 30px rgba(239, 68, 68, 0.22);
    }

    #game {
      width: 100%;
      height: 100%;
    }

    /* Layout vertical no celular: tela do jogo em cima e controles na metade inferior */
    @media (max-width: 768px) {
      body {
        padding: 0;
        background: #090b1a;
      }

      .container {
        max-width: 100%;
        height: 100dvh;
        gap: 0;
      }

      .header,
      .hint {
        display: none;
      }

      .stage {
        width: 100%;
        height: 100dvh;
        max-height: 100dvh;
        aspect-ratio: auto;
        border-radius: 0;
        border: none;
        box-shadow: none;
        background: #090b1a;
      }

      #game canvas {
        position: relative !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 46dvh !important;
        max-height: 46dvh !important;
        object-fit: contain !important;
        background: #000 !important;
        z-index: 2;
      }

      .ejs_virtual_gamepad,
      .ejs--gamepad,
      [class*="virtual_gamepad"],
      [class*="gamepad"] {
        position: fixed !important;
        top: 46dvh !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        width: 100% !important;
        height: 54dvh !important;
        transform: none !important;
        opacity: 1 !important;
        z-index: 10;
      }
    }

    .cover-overlay {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 22%, rgba(250, 204, 21, 0.24) 0%, rgba(250, 204, 21, 0) 50%),
        radial-gradient(circle at 50% 82%, rgba(220, 38, 38, 0.25) 0%, rgba(220, 38, 38, 0) 55%),
        linear-gradient(180deg, rgba(76, 29, 149, 0.92) 0%, rgba(30, 27, 75, 0.95) 55%, rgba(9, 11, 26, 0.98) 100%);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 16px;
      z-index: 9999;
      transition: opacity 0.25s ease;
    }

    .cover-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .box-3d {
      width: 145px;
      aspect-ratio: 3 / 4;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 16px 34px rgba(0, 0, 0, 0.8), 0 0 22px rgba(250, 204, 21, 0.28);
      border: 2px solid rgba(250, 204, 21, 0.45);
      transform: perspective(700px) rotateY(-8deg);
    }

    .box-3d img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .start-btn {
      background: linear-gradient(135deg, #facc15, #ef4444);
      color: #090d16;
      font-weight: 900;
      font-size: 0.98rem;
      border: 2px solid #fef08a;
      padding: 11px 28px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(239, 68, 68, 0.45);
    }

    .start-btn:active {
      transform: scale(0.97);
    }

    .hint {
      font-size: 0.8rem;
      color: #e0e7ff;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.55);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="badge">Kubo Touch • NES</div>
      <h1>Mighty Final Fight</h1>
    </div>

    <div class="stage">
      <div class="cover-overlay" id="coverOverlay">
        <div class="box-3d">
          <img src="./Midhty%20Final%20Fight%20NES.jpeg" alt="Capa Mighty Final Fight NES" />
        </div>
        <button class="start-btn" id="startBtn" type="button">Iniciar Jogo</button>
      </div>
      <div id="game"></div>
    </div>

    <p class="hint">No celular, os controles ficam na parte inferior; no PC, use as setas, Z / X ou Enter.</p>
  </div>

  <script>
    const ROM_URL = "./Mighty%20Final%20Fight%20(USA).nes";

    window.EJS_player = "#game";
    window.EJS_core = "nes";
    window.EJS_gameName = "Mighty Final Fight";
    window.EJS_gameUrl = ROM_URL;
    window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
    window.EJS_startOnLoaded = false;
    window.EJS_fullscreenOnLoaded = false;

    let started = false;

    document.getElementById("startBtn").addEventListener("click", () => {
      document.getElementById("coverOverlay").classList.add("hidden");

      if (!started) {
        started = true;
        const script = document.createElement("script");
        script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
        document.body.appendChild(script);
      } else if (window.EJS_emulator && typeof window.EJS_emulator.play === "function") {
        window.EJS_emulator.play();
      }
    });
  </script>
</body>
</html>
