<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b2545" />
  <title>Disney's DuckTales (NES) — Kubo Touch</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background:
        radial-gradient(circle at 50% 12%, rgba(250, 204, 21, 0.24) 0%, rgba(250, 204, 21, 0) 42%),
        radial-gradient(circle at 15% 85%, rgba(34, 197, 94, 0.16) 0%, rgba(34, 197, 94, 0) 45%),
        radial-gradient(circle at 85% 80%, rgba(126, 34, 206, 0.22) 0%, rgba(126, 34, 206, 0) 45%),
        linear-gradient(180deg, #0ea5e9 0%, #0b2545 48%, #071326 100%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 12px;
      gap: 12px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .header {
      text-align: center;
    }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fde047;
      background: rgba(11, 37, 69, 0.75);
      border: 1px solid rgba(250, 204, 21, 0.55);
      padding: 3px 11px;
      border-radius: 999px;
      margin-bottom: 4px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 900;
      color: #fef08a;
      text-shadow: 0 3px 0 #7c2d12, 0 8px 20px rgba(0, 0, 0, 0.55);
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      max-height: 56dvh;
      background: #071326;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid rgba(250, 204, 21, 0.35);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.7), 0 0 25px rgba(14, 165, 233, 0.2);
    }

    #game {
      width: 100%;
      height: 100%;
    }

    /* Ajustes para os controles virtuais do EmulatorJS no celular não invadirem o centro da tela */
    @media (max-width: 768px) {
      .stage {
        aspect-ratio: auto;
        height: 54dvh;
        max-height: 54dvh;
      }

      .ejs_virtual_gamepad,
      .ejs--gamepad,
      [class*="virtual_gamepad"],
      [class*="gamepad"] {
        transform: scale(0.78);
        transform-origin: bottom center;
        opacity: 0.78;
      }
    }

    .cover-overlay {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 25%, rgba(250, 204, 21, 0.25) 0%, rgba(250, 204, 21, 0) 50%),
        radial-gradient(circle at 50% 80%, rgba(14, 165, 233, 0.25) 0%, rgba(14, 165, 233, 0) 55%),
        linear-gradient(180deg, rgba(12, 74, 110, 0.92) 0%, rgba(11, 37, 69, 0.95) 55%, rgba(7, 19, 38, 0.97) 100%);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 16px;
      z-index: 9999;
      transition: opacity 0.25s ease;
    }

    .cover-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .box-3d {
      width: 135px;
      aspect-ratio: 3 / 4;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 16px 34px rgba(0, 0, 0, 0.8), 0 0 22px rgba(250, 204, 21, 0.28);
      border: 2px solid rgba(250, 204, 21, 0.45);
      transform: perspective(700px) rotateY(-8deg);
    }

    .box-3d img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .start-btn {
      background: linear-gradient(135deg, #facc15, #f97316);
      color: #090d16;
      font-weight: 900;
      font-size: 0.98rem;
      border: 2px solid #fef08a;
      padding: 11px 28px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(249, 115, 22, 0.45);
    }

    .start-btn:active {
      transform: scale(0.97);
    }

    .hint {
      font-size: 0.8rem;
      color: #e0f2fe;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="badge">Kubo Touch • NES</div>
      <h1>Disney's DuckTales</h1>
    </div>

    <div class="stage">
      <div class="cover-overlay" id="coverOverlay">
        <div class="box-3d">
          <img src="./Duck%20Tales%20NES.jpeg" alt="Capa Disney's DuckTales NES" />
        </div>
        <button class="start-btn" id="startBtn" type="button">Iniciar Jogo</button>
      </div>
      <div id="game"></div>
    </div>

    <p class="hint">Dica: gire o celular para a horizontal para jogar em tela mais ampla sem botões sobre a imagem.</p>
  </div>

  <script>
    const ROM_URL = "./DuckTales%20(USA).nes";

    window.EJS_player = "#game";
    window.EJS_core = "nes";
    window.EJS_gameName = "DuckTales";
    window.EJS_gameUrl = ROM_URL;
    window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
    window.EJS_startOnLoaded = false;
    window.EJS_fullscreenOnLoaded = false;

    let started = false;

    document.getElementById("startBtn").addEventListener("click", () => {
      document.getElementById("coverOverlay").classList.add("hidden");

      if (!started) {
        started = true;
        const script = document.createElement("script");
        script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
        document.body.appendChild(script);
      } else if (window.EJS_emulator && typeof window.EJS_emulator.play === "function") {
        window.EJS_emulator.play();
      }
    });
  </script>
</body>
</html>
